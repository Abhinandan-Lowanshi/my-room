plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}
def mapsApiKey = localProperties.getProperty("MAPS_API_KEY", "")
def baseUrl = localProperties.getProperty("BASE_URL", "https://example.com/api/")
def imagePath = localProperties.getProperty("IMAGE_PATH", "https://example.com/")

allprojects {
    repositories {
        google()
//       jcenter()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}
android {
    compileSdkVersion 31
    buildToolsVersion "30.0.2"
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
//    buildFeatures
//            {
//                viewBinding true
//            }
    defaultConfig {
        applicationId 'com.myroom.myroom'
        minSdkVersion 24
        targetSdkVersion 31
        versionCode 5
        versionName "1.5"
        multiDexEnabled true
        manifestPlaceholders = [MAPS_API_KEY: mapsApiKey]
        buildConfigField "String", "MAPS_API_KEY", "\"${mapsApiKey}\""
        buildConfigField "String", "BASE_URL", "\"${baseUrl}\""
        buildConfigField "String", "IMAGE_PATH", "\"${imagePath}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            crunchPngs false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
//    buildFeatures {
//        viewBinding true
//    }
}

